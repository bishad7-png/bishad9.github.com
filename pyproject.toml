[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-video-agent"
version = "0.1.0"
description = "Safe, configurable daily video-generation prototype"
requires-python = ">=3.10"

[project.scripts]
daily-video-agent = "daily_video_agent.cli:main"

[tool.setuptools.packages.find]
include = ["daily_video_agent*"]
